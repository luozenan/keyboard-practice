<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字练习</title>
<link rel="icon" href="/typing.ico">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  min-height: 100vh;
}
.container {
  max-width: none;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  overflow-x: auto;
}
.stats {
  font-size: 18px;
  color: #aaa;
  text-align: center;
}

/* Pinyin table */
.poetry-table {
  display: table;
  margin: 0 auto;
  border-collapse: collapse;
}
.poetry-table .table-row {
  display: table-row;
}
.poetry-table .table-cell {
  display: table-cell;
  text-align: center;
  padding: 0 4px;
}
.poetry-table .py-cell {
  font-size: 18px;
  color: #facc15;
}
.poetry-table .char-cell {
  font-size: 24px;
  color: #e0e0e0;
}
.poetry-table .py-cell.correct { color: #4ade80; }
.poetry-table .py-cell.wrong { color: #f87171; }
.poetry-table .py-cell.pending { color: #facc15; }

/* Poetry display */
.poetry-block {
  position: relative;
  text-align: center;
  max-width: 100%;
}
.poetry-source {
  font-size: 14px;
  color: #888;
  text-align: right;
  margin-top: 2px;
  margin-right: 10px;
}

/* Target text line */
.target-line {
  font-family: 'Courier New', monospace;
  font-size: 24px;
  line-height: 2;
  white-space: nowrap;
  overflow-x: auto;
  text-align: center;
}
.target-line .correct { color: #4ade80; }
.target-line .wrong { color: #f87171; }
.target-line .pending { color: #9ca3af; }

/* Keyboard */
.keyboard {
  font-family: 'Courier New', monospace;
  font-size: 17px;
  line-height: 2;
  white-space: pre;
}
.key-row { white-space: pre; }
.key-highlight {
  background: #eab308;
  color: #000;
  border-radius: 2px;
}

/* Mode buttons */
.mode-buttons {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}
.mode-btn {
  font-family: inherit;
  font-size: 15px;
  padding: 8px 24px;
  border: 1px solid #555;
  border-radius: 6px;
  background: transparent;
  color: #aaa;
  cursor: pointer;
  transition: all 0.2s;
}
.mode-btn:hover { border-color: #eab308; color: #eab308; }
.mode-btn.active {
  background: #eab308;
  color: #000;
  border-color: #eab308;
}
.shuffle-btn {
  font-family: inherit;
  font-size: 15px;
  padding: 8px 20px;
  border: 1px solid #555;
  border-radius: 6px;
  background: transparent;
  color: #aaa;
  cursor: pointer;
  margin-left: 8px;
  transition: all 0.2s;
}
.shuffle-btn:hover { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); }
.mode-btn {
  font-family: inherit;
  font-size: 15px;
  padding: 8px 24px;
  border: 1px solid #555;
  border-radius: 6px;
  background: transparent;
  color: #aaa;
  cursor: pointer;
  transition: all 0.2s;
}
.mode-btn:hover { border-color: #eab308; color: #eab308; }
.mode-btn.active {
  background: #eab308;
  color: #000;
  border-color: #eab308;
}

/* Footer hint */
.hint {
  font-size: 15px;
  color: #666;
  text-align: center;
}

/* Final stats overlay */
.final-stats {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  z-index: 100;
}
.final-stats.show { display: flex; }
.final-box {
  background: #16213e;
  padding: 40px 60px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid #eab308;
}
.final-box h2 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #eab308;
}
.final-box p {
  font-size: 16px;
  margin: 8px 0;
}
.final-box button {
  margin-top: 24px;
  padding: 10px 32px;
  font-size: 16px;
  border: none;
  border-radius: 6px;
  background: #eab308;
  color: #000;
  cursor: pointer;
  font-family: inherit;
}
.final-box button:hover { background: #facc15; }
</style>
</head>
<body>
<div class="container">
  <div class="stats" id="stats"></div>
  <div class="pinyin-line" id="pinyinLine"></div>
  <div class="poetry-block" id="poetryBlock">
    <div class="target-line" id="targetLine"></div>
    <div class="poetry-source" id="sourceLine"></div>
  </div>
  <div class="keyboard" id="keyboard"></div>
  <div class="mode-buttons">
    <button class="mode-btn active" data-mode="words" onclick="switchMode('words')">单词模式</button>
    <button class="mode-btn" data-mode="dialogue" onclick="switchMode('dialogue')">对话模式</button>
    <button class="mode-btn" data-mode="poetry" onclick="switchMode('poetry')">诗词模式</button>
    <button class="shuffle-btn" onclick="shuffle()">🎲 换一换</button>
  </div>
  <div class="hint">按 Esc 结束 | Backspace 退格</div>
</div>
<div class="final-stats" id="finalStats">
  <div class="final-box">
    <h2>完成！最终统计</h2>
    <p id="finalSentences"></p>
    <p id="finalChars"></p>
    <p id="finalCorrect"></p>
    <p id="finalBackspaces"></p>
    <p id="finalAccuracy"></p>
    <p id="finalSpeed"></p>
    <button onclick="location.reload()">再来一次</button>
  </div>
</div>

<script>
let ws = null;
let currentMode = 'words';

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws');
  ws.onmessage = function(event) {
    const data = JSON.parse(event.data);
    if (data.done) {
      showFinalStats(data);
      return;
    }
    updateUI(data);
  };
  ws.onclose = function() {
    setTimeout(function() {
      connect();
      setTimeout(function() {
        // Re-send current mode on reconnection
        if (ws && ws.readyState === WebSocket.OPEN && currentMode !== 'words') {
          ws.send(JSON.stringify({ key: '', mode: currentMode }));
        }
      }, 200);
    }, 1000);
  };
}

function updateUI(data) {
  const isPoetry = data.mode === 'poetry';
  const isDialogue = data.mode === 'dialogue';

  // Stats
  const modeLabel = { words: '单词', dialogue: '对话', poetry: '诗词' }[data.mode] || data.mode;
  const accuracy = data.total_chars > 0
    ? (data.correct_chars / data.total_chars * 100).toFixed(1)
    : '100.0';
  document.getElementById('stats').textContent =
    `模式: ${modeLabel} | 句子: ${data.sentences_done} | 正确率: ${accuracy}% | 字符: ${data.total_chars} | 退格: ${data.backspace_count}`;

  // Pinyin line (only for poetry mode)
  const pinyinEl = document.getElementById('pinyinLine');
  if (isPoetry) {
    pinyinEl.style.display = 'none';
  } else {
    pinyinEl.style.display = 'none';
  }
  const sourceEl = document.getElementById('sourceLine');
  sourceEl.style.display = isPoetry ? 'block' : 'none';
  if (isPoetry) {
    sourceEl.textContent = data.source;
  }

  if (isPoetry) {

    // Build character-by-character poetry display with pinyin above each char
    const chars = data.target_text.split('');
    const pinyins = data.pinyin_line.split(' ');

    while (pinyins.length < chars.length) pinyins.push('');

    // Build a per-cell typed-offset mapping
    let pinyinChars = data.pinyin_chars || [];

    let tableHtml = '<div class="poetry-table">';
    // Pinyin row - each syllable colored char by char using pinyin_chars
    tableHtml += '<div class="table-row">';
    let pos = 0;
    for (let i = 0; i < chars.length; i++) {
      const py = pinyins[i];

      // Check if this syllable is just punctuation (not in pinyin_chars)
      const isPunct = py.length > 0 && !/[a-zA-Z]/.test(py);

      if (i > 0 && !isPunct) {
        // Space between syllables — add a space cell
        let spaceCls = '';
        if (pos < data.typed.length) {
          const t = data.typed[pos];
          spaceCls = t === ' ' ? 'correct' : 'wrong';
        } else {
          spaceCls = 'pending';
        }
        tableHtml += `<div class="py-cell table-cell">${escapeHtml(' ')}</div>`;
        pos += 1;
      }

      let cellHtml = '';
      if (isPunct) {
        // Show punctuation as-is, no color
        cellHtml = escapeHtml(py);
      } else {
        for (let j = 0; j < py.length; j++) {
          const pyChar = py[j];
          let cls = '';
          if (pos < data.typed.length) {
            const t = data.typed[pos];
            cls = t === pyChar ? 'correct' : 'wrong';
          } else {
            cls = 'pending';
          }
          cellHtml += `<span class="${cls}">${escapeHtml(pyChar)}</span>`;
          pos += 1;
        }
      }
      tableHtml += `<div class="py-cell table-cell">${cellHtml}</div>`;
    }
    tableHtml += '</div>';
    // Character row (always white, no coloring)
    tableHtml += '<div class="table-row">';
    for (let i = 0; i < chars.length; i++) {
      const py = pinyins[i];
      const isPunct = py.length > 0 && !/[a-zA-Z]/.test(py);
      if (i > 0 && !isPunct) {
        tableHtml += `<div class="char-cell table-cell">&nbsp;</div>`;
      }
      tableHtml += `<div class="char-cell table-cell">${escapeHtml(chars[i])}</div>`;
    }
    tableHtml += '</div>';
    tableHtml += '</div>';

    pinyinEl.style.display = 'none';
    document.getElementById('targetLine').innerHTML = tableHtml;
  } else {
    // Normal mode: single target line with colors
    let html = '';
    for (let i = 0; i < data.target_text.length; i++) {
      const tc = data.target_text[i];
      if (i < data.typed.length) {
        const t = data.typed[i];
        const cls = t === tc ? 'correct' : 'wrong';
        html += `<span class="${cls}">${escapeHtml(t)}</span>`;
      } else {
        html += `<span class="pending">${escapeHtml(tc)}</span>`;
      }
    }
    document.getElementById('targetLine').innerHTML = html;
    document.getElementById('targetLine').className = 'target-line';
  }

  // Keyboard
  const highlightSet = new Set();
  for (const r of data.highlight_ranges) {
    const row = r.row;
    for (let c = r.left; c <= r.right; c++) {
      highlightSet.add(row + ':' + c);
    }
  }

  let kbHtml = '';
  for (let ri = 0; ri < data.keyboard_lines.length; ri++) {
    const line = data.keyboard_lines[ri];
    let rowHtml = '<div class="key-row">';
    for (let ci = 0; ci < line.length; ci++) {
      const ch = line[ci];
      if (highlightSet.has(ri + ':' + ci)) {
        rowHtml += `<span class="key-highlight">${escapeHtml(ch)}</span>`;
      } else {
        rowHtml += escapeHtml(ch);
      }
    }
    rowHtml += '</div>';
    kbHtml += rowHtml;
  }
  document.getElementById('keyboard').innerHTML = kbHtml;
}

function showFinalStats(data) {
  const elapsed = data.elapsed_secs;
  const accuracy = data.total_chars > 0
    ? (data.correct_chars / data.total_chars * 100).toFixed(1)
    : '0.0';
  const cpm = elapsed > 0
    ? Math.round(data.total_chars / elapsed * 60)
    : 0;

  document.getElementById('finalSentences').textContent = `完成句子: ${data.sentences_done}`;
  document.getElementById('finalChars').textContent = `总输入字符: ${data.total_chars}`;
  document.getElementById('finalCorrect').textContent = `正确字符: ${data.correct_chars}`;
  document.getElementById('finalAccuracy').textContent = `正确率: ${accuracy}%`;
  document.getElementById('finalBackspaces').textContent = `退格次数: ${data.backspace_count}`;
  document.getElementById('finalSpeed').textContent = `速度: ${cpm} CPM`;
  document.getElementById('finalStats').classList.add('show');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ key: '', mode }));
  }
}

function shuffle() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ key: 'Shuffle', mode: null }));
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    sendKey('Esc');
    return;
  }
  if (e.key === 'Backspace') {
    sendKey('Backspace');
    e.preventDefault();
    return;
  }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    sendKey(e.key);
    e.preventDefault();
  }
});

function sendKey(key) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ key, mode: null }));
  }
}

connect();
</script>
</body>
</html>
